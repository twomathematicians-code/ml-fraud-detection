name: Fraud Detection CI
on:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml"]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install poetry==1.8.3 && poetry install --only dev
      - run: poetry run ruff check src/ tests/
      - run: poetry run black --check src/ tests/
      - run: poetry run mypy src/ --ignore-missing-imports

  test:
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: fraud_test, POSTGRES_USER: fraud, POSTGRES_PASSWORD: testpass }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get install -y libpq-dev
      - run: pip install poetry==1.8.3 && poetry install --with dev
      - run: poetry run pytest tests/ -v --cov=src --cov-report=xml
        env: { DATABASE_URL: "postgresql+asyncpg://fraud:testpass@localhost:5432/fraud_test" }
      - uses: codecov/codecov-action@v4
        with: { files: ./coverage.xml }

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v5
        with:
          push: false
          tags: fraud-detector:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
