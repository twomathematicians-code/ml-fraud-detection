version: "3.9"
services:
  api:
    build: .
    container_name: fraud-api
    ports: ["8000:8000"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+asyncpg://fraud:fraudpass@db:5432/fraud_db
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    restart: unless-stopped
    networks: [fraud-net]

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports: ["6379:6379"]
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    networks: [fraud-net]

  db:
    image: postgres:16-alpine
    container_name: fraud-db
    environment:
      - POSTGRES_USER=fraud
      - POSTGRES_PASSWORD=fraudpass
      - POSTGRES_DB=fraud_db
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [fraud-net]

volumes:
  pgdata:
  redis_data:

networks:
  fraud-net:
    driver: bridge
