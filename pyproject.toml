[tool.poetry]
name = "ml-fraud-detection"
version = "2.0.0"
description = "Real-time fraud detection engine with XGBoost ensemble, Isolation Forest anomaly detection, and Redis caching for sub-20ms scoring."
authors = ["Mahesh Pravinsinh Solanki <maheshsinh1910@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pydantic = "^2.7.0"
pydantic-settings = "^2.3.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.29.0"
scikit-learn = "^1.5.0"
xgboost = "^2.0.3"
lightgbm = "^4.3.0"
imbalanced-learn = "^0.12.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
mlflow = "^2.14.0"
httpx = "^0.27.0"
pyyaml = "^6.0"
redis = "^5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
black = "^24.4.0"
ruff = "^0.4.0"
mypy = "^1.10.0"
bandit = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
