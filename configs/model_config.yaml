# Fraud Detection Model Configuration
detection:
  anomaly_contamination: 0.01
  fraud_threshold: 0.5
  batch_size: 500
  max_concurrent_requests: 100

features:
  velocity_windows: [1h, 6h, 24h, 7d]
  merchant_categories:
    - retail
    - travel
    - food
    - entertainment
    - utility
    - financial
    - healthcare

xgboost:
  max_depth: 6
  learning_rate: 0.05
  n_estimators: 200
  scale_pos_weight: 99
  subsample: 0.8
  colsample_bytree: 0.8

isolation_forest:
  contamination: 0.01
  n_estimators: 100

redis:
  ttl_seconds: 3600
  max_memory: 128mb
  key_prefix: "fraud:"
